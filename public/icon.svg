<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Kohinoor Diamond / Crown Emblem -->
  <g filter="url(#shadow)">
    <!-- Diamond Top Facet -->
    <polygon points="256,90 350,165 162,165" fill="#fef08a" opacity="0.95" />
    <!-- Diamond Side Facets -->
    <polygon points="162,165 256,90 120,165" fill="#fde047" opacity="0.8" />
    <polygon points="350,165 256,90 392,165" fill="#eab308" opacity="0.8" />
    <!-- Center Jewel Body -->
    <polygon points="120,165 162,165 256,310" fill="#facc15" />
    <polygon points="162,165 350,165 256,310" fill="#eab308" />
    <polygon points="350,165 392,165 256,310" fill="#ca8a04" />
    <!-- Inner Sparkle -->
    <polygon points="220,175 256,190 292,175 256,260" fill="#fffbeb" opacity="0.9" />
  </g>

  <!-- Restaurant Cloche Base / Plate -->
  <path d="M140 340 L372 340 A16 16 0 0 1 388 356 L388 364 A8 8 0 0 1 380 372 L132 372 A8 8 0 0 1 124 364 L124 356 A16 16 0 0 1 140 340 Z" fill="url(#gold)" />
  
  <!-- Brand Text -->
  <text x="256" y="420" font-family="'Cinzel', 'Noto Sans Devanagari', serif, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">HOTEL KOHINOOR</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#fde047" text-anchor="middle" letter-spacing="4">RESTAURANT POS</text>
</svg>
